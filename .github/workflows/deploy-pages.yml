name: Deploy website

on:
  push:
    branches: [main, claude/zealous-brown-7i5ws4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # The Supabase project that stores accounts and data. The anon key is
          # public by design; row level security in the database protects the data.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://rtmpafeqpqbmblssnyoz.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bXBhZmVxcHFibWJsc3NueW96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzk0MzksImV4cCI6MjEwNTg1NTQzOX0.Dqd1wWsA31-1946rlVUSMZBwjwsTpKf47sM3TroW5_w' }}
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
