name: Deploy website

on:
  push:
    branches: [main, claude/zealous-brown-7i5ws4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          # The site lives at the root of its own domain (sdmivtzoim.com), so no sub-path.
          NEXT_PUBLIC_BASE_PATH: ""
          # The Supabase project that stores accounts and data. The anon key is
          # public by design (the publishable key); row level security in the database protects the data.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://fkyzknggspsaeqguendg.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_oIxp_hwqWel4gEPUqUciCg_DZ-0TU5V' }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # Serves the site at this address (GitHub Pages custom domain).
          cname: sdmivtzoim.com
